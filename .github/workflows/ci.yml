name: CI

env:
  # KSM-13: Prevent LFS failures from blocking CI/CD
  GIT_LFS_SKIP_SMUDGE: "1"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        backend: [CPU, CUDA, OPENCL]
        exclude:
          - os: macos-latest
            backend: CUDA
          - os: windows-latest
            backend: OPENCL

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up C++
      uses: actions/setup-cpp@v2
      with:
        cpp-version: '14'

    - name: Configure CMake
      run: cmake . -B build -DGGML_USE_${{ matrix.backend }}=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

  test-python:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install numpy

    - name: Run dte_nodes unit tests
      run: python tests/test_dte_nodes.py -v