name: CI

env:
  # KSM-13: Prevent LFS failures from blocking CI/CD
  GIT_LFS_SKIP_SMUDGE: "1"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        backend: [CPU, CUDA, OPENCL]
        exclude:
          - os: macos-latest
            backend: CUDA
          - os: windows-latest
            backend: OPENCL
          # CUDA requires nvidia-docker or self-hosted runners with GPU
          - os: ubuntu-latest
            backend: CUDA

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # Install C++ compiler and build tools per platform
    # Note: actions/setup-cpp does not exist; install compilers directly
    - name: Install build tools (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Install build tools (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake

    - name: Install build tools (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

    - name: Install OpenCL (Ubuntu)
      if: matrix.backend == 'OPENCL' && runner.os == 'Linux'
      run: |
        sudo apt-get install -y ocl-icd-opencl-dev

    - name: Configure CMake
      run: cmake . -B build -DGGML_USE_${{ matrix.backend }}=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

  test-python:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install numpy

    - name: Run dte_nodes unit tests
      run: python tests/test_dte_nodes.py -v
