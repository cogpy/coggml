name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: coggml-linux-x64
          - os: macos-latest
            artifact_name: coggml-macos-x64
          - os: windows-latest
            artifact_name: coggml-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Configure CMake
      run: cmake . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Archive artifacts
      run: |
        mkdir -p artifacts
        if [ "${{ runner.os }}" == "Windows" ]; then
          7z a artifacts/${{ matrix.artifact_name }}.zip ./build/bin/*
        else
          tar -czvf artifacts/${{ matrix.artifact_name }}.tar.gz -C build/bin .
        fi
      shell: bash

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
